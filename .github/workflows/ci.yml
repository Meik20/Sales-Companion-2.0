name: CI & Integrity Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Architecture Integrity
        run: npm run check:integrity

      - name: Check Production Security Audit
        run: npm audit --omit=dev

      - name: Build Shared Package
        run: npm run build:shared

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test:web

      - name: Build Web Application
        run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_FIREBASE_API_KEY: 'AIzaSyBuildPrerenderKey00000000000000'
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: 'sales-companion-ci.firebaseapp.com'
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'sales-companion-ci'
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: 'sales-companion-ci.appspot.com'
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:000000000000'
